[project]
name = "concept-mapper"
version = "0.1.0"
description = "Build standard OHDSI SNOMED concept sets from ICD 9/10/O-3 code strings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jamie" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "duckdb>=0.10.0",
    "databricks-sql-connector>=3.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
concept-mapper = "concept_mapper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concept_mapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
